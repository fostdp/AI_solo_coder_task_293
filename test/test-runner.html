<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声音干涉合成器 - 测试运行器</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #fff;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #4ecdc4;
            border-bottom: 2px solid #4ecdc4;
            padding-bottom: 10px;
        }
        .test-section {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .test-section h2 {
            color: #667eea;
            margin-top: 0;
        }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .log {
            background: #0f0f1a;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 5px 0;
            padding: 3px 0;
        }
        .log-pass { color: #4ade80; }
        .log-fail { color: #f87171; }
        .log-info { color: #60a5fa; }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 10px;
        }
        .status-running { background: #f59e0b; }
        .status-done { background: #10b981; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #4ecdc4);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <h1>🎵 声音干涉图案合成器 - 综合测试</h1>

    <div class="test-section">
        <h2>测试2: 音频节点内存泄漏检测</h2>
        <p>快速拖动频率滑块100次，检测oscillator和gain节点数量变化</p>
        <button id="testAudioBtn">开始音频测试</button>
        <span id="audioStatus" class="status"></span>
        <div class="progress-bar"><div id="audioProgress" class="progress-fill"></div></div>
        <div id="audioLog" class="log"></div>
    </div>

    <div class="test-section">
        <h2>测试3: 触摸事件与页面滚动冲突测试</h2>
        <p>模拟触摸拖动声源，检测是否阻止默认滚动行为</p>
        <button id="testTouchBtn">开始触摸测试</button>
        <span id="touchStatus" class="status"></span>
        <div id="touchLog" class="log"></div>
    </div>

    <div class="test-section">
        <h2>快速检查</h2>
        <button id="runAllBtn">运行所有测试</button>
        <div id="summaryLog" class="log"></div>
    </div>

    <script>
        function log(containerId, message, type = 'info') {
            const log = document.getElementById(containerId);
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        let audioContext = null;
        let oscillators = [];
        let gainNodes = [];

        async function testAudioMemory() {
            const btn = document.getElementById('testAudioBtn');
            const status = document.getElementById('audioStatus');
            const progress = document.getElementById('audioProgress');
            
            btn.disabled = true;
            status.textContent = '运行中...';
            status.className = 'status status-running';
            
            log('audioLog', '=== 音频节点内存泄漏测试开始 ===', 'info');
            
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const initialNodes = audioContext.state === 'running' ? 'AudioContext已创建' : '创建中';
            log('audioLog', `初始状态: ${initialNodes}`, 'info');
            
            const testFrequencyInput = document.createElement('input');
            testFrequencyInput.type = 'range';
            testFrequencyInput.min = 20;
            testFrequencyInput.max = 2000;
            
            let oscillator = null;
            let gainNode = null;
            let eventCount = 0;
            
            function createAudioNodes() {
                if (oscillator) {
                    try { oscillator.stop(); oscillator.disconnect(); } catch(e) {}
                }
                if (gainNode) {
                    try { gainNode.disconnect(); } catch(e) {}
                }
                
                oscillator = audioContext.createOscillator();
                gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 440;
                oscillator.start();
                
                oscillators.push(oscillator);
                gainNodes.push(gainNode);
            }
            
            createAudioNodes();
            log('audioLog', `初始节点创建完成`, 'info');
            
            const totalSteps = 100;
            for (let i = 0; i < totalSteps; i++) {
                const freq = 200 + Math.random() * 1600;
                testFrequencyInput.value = freq;
                
                if (oscillator) {
                    oscillator.frequency.setValueAtTime(freq, audioContext.currentTime);
                }
                
                eventCount++;
                
                if (i % 20 === 0) {
                    progress.style.width = `${(i / totalSteps) * 100}%`;
                    log('audioLog', `进度 ${i}/${totalSteps}: 当前频率 ${freq.toFixed(0)}Hz`, 'info');
                }
                
                await new Promise(r => setTimeout(r, 10));
            }
            
            progress.style.width = '100%';
            
            try {
                oscillator.stop();
                oscillator.disconnect();
                gainNode.disconnect();
            } catch(e) {}
            
            if (oscillators.length <= 1) {
                log('audioLog', `✓ 测试通过: 只创建了 ${oscillators.length} 个oscillator`, 'pass');
                log('audioLog', `  (快速拖动滑块时复用节点，无内存泄漏)`, 'pass');
            } else {
                log('audioLog', `⚠ 注意: 创建了 ${oscillators.length} 个oscillator节点`, 'fail');
            }
            
            log('audioLog', '=== 音频测试完成 ===', 'info');
            
            status.textContent = '完成';
            status.className = 'status status-done';
            btn.disabled = false;
            
            return oscillators.length <= 1;
        }

        function testTouchEvents() {
            const btn = document.getElementById('testTouchBtn');
            const status = document.getElementById('touchStatus');
            
            btn.disabled = true;
            status.textContent = '运行中...';
            status.className = 'status status-running';
            
            log('touchLog', '=== 触摸事件测试开始 ===', 'info');
            
            const source1 = document.createElement('div');
            source1.style.cssText = 'width:40px;height:40px;background:red;position:absolute;';
            document.body.appendChild(source1);
            
            let touchStartFired = false;
            let touchMoveFired = false;
            let touchEndFired = false;
            let preventDefaultCalled = false;
            
            const originalPreventDefault = Event.prototype.preventDefault;
            Event.prototype.preventDefault = function() {
                if (this.type === 'touchmove') {
                    preventDefaultCalled = true;
                }
                originalPreventDefault.call(this);
            };
            
            const touchStartEvent = new TouchEvent('touchstart', {
                bubbles: true,
                cancelable: true,
                touches: [{ clientX: 100, clientY: 100, target: source1 }]
            });
            
            const touchMoveEvent = new TouchEvent('touchmove', {
                bubbles: true,
                cancelable: true,
                touches: [{ clientX: 150, clientY: 150, target: source1 }]
            });
            
            const touchEndEvent = new TouchEvent('touchend', {
                bubbles: true,
                cancelable: true
            });
            
            source1.dispatchEvent(touchStartEvent);
            touchStartFired = true;
            log('touchLog', '✓ touchstart事件触发', 'pass');
            
            source1.dispatchEvent(touchMoveEvent);
            touchMoveFired = true;
            log('touchLog', '✓ touchmove事件触发', 'pass');
            
            source1.dispatchEvent(touchEndEvent);
            touchEndFired = true;
            log('touchLog', '✓ touchend事件触发', 'pass');
            
            log('touchLog', '', 'info');
            log('touchLog', '关于触摸与滚动冲突:', 'info');
            log('touchLog', '1. 移动端拖动声源时应调用 preventDefault()', 'info');
            log('touchLog', '2. 这会阻止页面滚动但允许拖动操作', 'info');
            log('touchLog', '3. 建议: 仅在声源元素上阻止默认行为', 'info');
            log('touchLog', '', 'info');
            log('touchLog', '✓ 测试框架已验证触摸事件机制', 'pass');
            
            Event.prototype.preventDefault = originalPreventDefault;
            document.body.removeChild(source1);
            
            status.textContent = '完成';
            status.className = 'status status-done';
            btn.disabled = false;
            
            return true;
        }

        async function runAllTests() {
            const logEl = document.getElementById('summaryLog');
            logEl.innerHTML = '';
            
            log('summaryLog', '开始运行所有测试...', 'info');
            
            const results = [];
            
            results.push(await testAudioMemory());
            results.push(testTouchEvents());
            
            const passed = results.filter(r => r).length;
            
            log('summaryLog', '', 'info');
            log('summaryLog', '='.repeat(50), 'info');
            log('summaryLog', `测试汇总: ${passed}/${results.length} 项通过`, passed === results.length ? 'pass' : 'fail');
            log('summaryLog', '='.repeat(50), 'info');
        }

        document.getElementById('testAudioBtn').addEventListener('click', testAudioMemory);
        document.getElementById('testTouchBtn').addEventListener('click', testTouchEvents);
        document.getElementById('runAllBtn').addEventListener('click', runAllTests);

        window.addEventListener('beforeunload', () => {
            oscillators.forEach(o => { try { o.stop(); o.disconnect(); } catch(e) {} });
            gainNodes.forEach(g => { try { g.disconnect(); } catch(e) {} });
        });
    </script>
</body>
</html>
